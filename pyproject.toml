[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pyredis"
version = "0.0.1"
requires-python = ">= 3.13"

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.isort]
profile = "black"
